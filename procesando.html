<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procesando tu reserva</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="card theme-accent">
      <div id="procesandoIcon" class="status-icon spin" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" stroke-dasharray="34 20" />
        </svg>
      </div>

      <h1 class="title">Procesando tu solicitud</h1>
      <p class="message">
        Estamos comprobando la disponibilidad del horario. Esto solo tomará
        unos segundos, no cierres esta página.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
