<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva de actividades educativas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="welcome-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 7V3M16 7V3M4 11H20M6 5H18C19.1046 5 20 5.89543 20 7V19C20 20.1046 19.1046 21 18 21H6C4.89543 21 4 20.1046 4 19V7C4 5.89543 4.89543 5 6 5Z"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <h1 class="title">Reserva de actividades</h1>
      <p class="message">
        Este sitio muestra el resultado de tus solicitudes de reserva de actividades
        educativas. Para solicitar una nueva actividad, utiliza el formulario.
      </p>

      <div class="actions">
        <a id="formButton" class="btn" href="#">Ir al formulario</a>
      </div>

      <p class="footer-note">
        ¿Ya has enviado una solicitud? El resultado aparecerá automáticamente
        tras completar el proceso.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
